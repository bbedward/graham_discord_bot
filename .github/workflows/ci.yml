name: CI

on:
  push:
    branches: [master, v5-slash-commands]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m unittest test/*.py

  build_and_publish:
    name: Build and Publish Docker Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get branch name
        shell: bash
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | tr / -)" >> $GITHUB_ENV

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: bananocoin/graham:${{ env.BRANCH_NAME }}-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: build_and_publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # v5 canary: restore [bbet, nano, graham_banano, bananobot] once verified
        app: [bbet, nano]
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.x'
      - uses: azure/setup-kubectl@v4

      - name: Get branch name
        shell: bash
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | tr / -)" >> $GITHUB_ENV

      - name: Set image
        working-directory: ./kubernetes/${{ matrix.app }}
        run: |
          kustomize edit set image replaceme=bananocoin/graham:${{ env.BRANCH_NAME }}-${{ github.run_id }}
          kustomize build . > deployment-k.yaml

      - name: Deploy image to k8s cluster
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl apply -f ./kubernetes/${{ matrix.app }}/deployment-k.yaml
